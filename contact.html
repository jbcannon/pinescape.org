<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Pinescape</title>
<meta name="description" content="Get in touch with the Pinescape team by email or the contact form."><link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div data-include="partials/header.html"></div>

<main>
<section class="wrap page-header">
  <h1><img class="heading-icon" src="assets/img/logos/pine-mark.png" alt="">Contact</h1>
</section>

<section class="wrap section">
  <div class="contact-column">
  <p>
    You can email us directly at <a class="text-link" href="mailto:contact@pinescape.org">contact@pinescape.org</a>.
  </p>
  <p>
    The Pinescape VR project is led by the <a class="text-link" href="https://lab.jonesctr.org/cannon/" target="_blank" rel="noopener">Landscape Ecology Lab</a> at the Jones Center at Ichauway. Visit the lab website for contact info, or fill out the form below.
  </p>

  <form id="contact-form" class="contact-form">
    <div class="form-field">
      <label for="cf-name">Name</label>
      <input type="text" id="cf-name" name="name" maxlength="100" autocomplete="name">
    </div>
    <div class="form-field">
      <label for="cf-email">Email *</label>
      <input type="email" id="cf-email" name="email" maxlength="254" autocomplete="email" required>
    </div>
    <div class="form-field">
      <label for="cf-affiliation">Affiliation</label>
      <input type="text" id="cf-affiliation" name="affiliation" maxlength="200" autocomplete="organization">
    </div>
    <div class="form-field">
      <label for="cf-reason">Topic *</label>
      <select id="cf-reason" name="reason" required>
        <option value="User Question" selected>User Question</option>
        <option value="Support">Support</option>
        <option value="Bug Report">Bug Report</option>
        <option value="Media Inquiry">Media Inquiry</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-field">
      <label for="cf-message">Message *</label>
      <textarea id="cf-message" name="message" rows="6" maxlength="5000" required></textarea>
    </div>
    <!-- Honeypot: hidden from people, filled in by simple bots. -->
    <div aria-hidden="true" style="position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden;">
      <label for="cf-website">Website</label>
      <input type="text" id="cf-website" name="website" tabindex="-1" autocomplete="off">
    </div>
    <!-- Cloudflare Turnstile: same public site key as download.html. -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFHU2CwMeLRk30Qr" data-size="flexible" style="margin-bottom:14px;"></div>
    <button type="submit" class="btn btn--primary">Send Message</button>
  </form>
  <p id="contact-form-status" class="form-status" role="status" aria-live="polite" hidden></p>
  </div>
</section>
</main>

<div data-include="partials/footer.html"></div>

<script src="assets/js/main.js"></script>
<script src="assets/js/contact-form.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
